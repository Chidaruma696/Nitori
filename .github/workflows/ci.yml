name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node --test · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/
      - name: dist is up to date
        run: python3 scripts/build.py && git diff --exit-code dist/
