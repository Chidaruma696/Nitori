<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nitori · scale demo</title>
<script src="../dist/nitori.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
  /* Catppuccin, flat. Latte by day, Mocha by night (follows the system; the ☾/☀ button forces one). */
  :root {
    --base:#eff1f5; --mantle:#e6e9ef; --crust:#dce0e8; --surface0:#ccd0da; --surface1:#bcc0cc; --surface2:#acb0be;
    --text:#4c4f69; --subtext:#6c6f85; --overlay:#9ca0b0;
    --mauve:#8839ef; --pink:#ea76cb; --blue:#1e66f5; --lavender:#7287fd; --green:#40a02b; --red:#d20f39; --yellow:#df8e1d; --peach:#fe640b;
    --on-accent:#ffffff; --paper:#ffffff;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="latte"]) {
    --base:#1e1e2e; --mantle:#181825; --crust:#11111b; --surface0:#313244; --surface1:#45475a; --surface2:#585b70;
    --text:#cdd6f4; --subtext:#a6adc8; --overlay:#6c7086;
    --mauve:#cba6f7; --pink:#f5c2e7; --blue:#89b4fa; --lavender:#b4befe; --green:#a6e3a1; --red:#f38ba8; --yellow:#f9e2af; --peach:#fab387;
    --on-accent:#1e1e2e; --paper:#181825;
  } }
  :root[data-theme="mocha"] {
    --base:#1e1e2e; --mantle:#181825; --crust:#11111b; --surface0:#313244; --surface1:#45475a; --surface2:#585b70;
    --text:#cdd6f4; --subtext:#a6adc8; --overlay:#6c7086;
    --mauve:#cba6f7; --pink:#f5c2e7; --blue:#89b4fa; --lavender:#b4befe; --green:#a6e3a1; --red:#f38ba8; --yellow:#f9e2af; --peach:#fab387;
    --on-accent:#1e1e2e; --paper:#181825;
  }
  * { box-sizing:border-box; }
  html { color-scheme: light dark; }
  body { margin:0; min-height:100vh; background:var(--base); color:var(--text); font:15px/1.55 -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  header { background:var(--mantle); padding:18px 24px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:22px; font-weight:700; letter-spacing:-.01em; }
  header h1 span { color:var(--mauve); }
  header .kicker { font-size:13px; color:var(--subtext); flex:1; }
  #btnTheme { padding:6px 12px; font-size:15px; }
  .wrap { max-width:1040px; margin:22px auto 40px; padding:0 16px; display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:760px) { .wrap { grid-template-columns:1fr; } }
  .card { background:var(--mantle); border-radius:16px; padding:22px 24px; }
  .card h2 { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:var(--mauve); margin:0 0 14px; }
  button { font:inherit; font-weight:600; font-size:14px; border:0; background:var(--surface0); color:var(--text); padding:9px 18px; border-radius:10px; cursor:pointer; transition:background .12s, opacity .12s; }
  button:hover { background:var(--surface1); }
  button.primary { background:var(--mauve); color:var(--on-accent); }
  button.primary:hover { opacity:.88; background:var(--mauve); }
  button.soft { background:var(--blue); color:var(--on-accent); }
  button.soft:hover { opacity:.88; background:var(--blue); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  input, select { font:inherit; padding:9px 12px; border:2px solid var(--surface0); border-radius:10px; background:var(--paper); color:var(--text); outline:none; }
  input:focus { border-color:var(--mauve); }
  label { font-size:13px; color:var(--subtext); display:inline-flex; align-items:center; gap:8px; }
  input[type=checkbox] { accent-color:var(--mauve); }
  .display { background:var(--crust); border-radius:12px; padding:20px 22px 12px; text-align:right; }
  #weight { font: 700 64px/1 -apple-system, 'Segoe UI', Roboto, sans-serif; color:var(--mauve); letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  #weight::after { content:' kg'; font-size:20px; font-weight:600; color:var(--subtext); letter-spacing:0; }
  #phase { font-size:13px; color:var(--subtext); min-height:20px; margin-top:8px; text-align:left; }
  .chip { display:inline-block; padding:4px 12px; border-radius:999px; font-size:12px; font-weight:700; color:var(--on-accent); }
  .on { background:var(--green); } .off { background:var(--red); } .re { background:var(--yellow); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--surface0); }
  th { font-size:12px; color:var(--subtext); font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
  tbody tr:last-child td { border-bottom:none; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  td button { padding:5px 12px; font-size:12px; }
  .sub { color:var(--subtext); font-size:13px; }
  #notice { font-size:13px; color:var(--peach); min-height:20px; margin-top:10px; }
  #btnLang { padding:6px 12px; font-size:13px; }
  a { color:var(--blue); }
  code { background:var(--crust); padding:1px 6px; border-radius:6px; font-size:12.5px; }
  #log { font:12px/1.5 ui-monospace, Consolas, monospace; background:var(--crust); color:var(--text); padding:12px 14px; border-radius:10px; height:150px; overflow:auto; white-space:pre-wrap; margin-top:12px; }
  .label { width:80mm; height:40mm; border:1px dashed var(--surface1); padding:2mm; margin:4px; display:inline-block; text-align:center; background:#fff; color:#000; }
  .label .n { font-weight:600; font-size:13px; height:34px; overflow:hidden; }
  .label .p { font-size:16px; font-weight:700; }
  @media print { body * { visibility:hidden; } #printArea, #printArea * { visibility:visible; } #printArea { position:absolute; left:0; top:0; background:#fff; } .label { border:none; margin:0; page-break-after:always; } }
</style>
<script>
  // Apply the saved theme before painting, so it doesn't flash.
  (function () { try { var t = localStorage.getItem('nitori:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {} })();
</script>
</head>
<body>
<header>
  <h1>Nito<span>ri</span></h1>
  <span class="kicker" data-t="kicker"></span>
  <span id="chip" class="chip off"></span>
  <button id="btnLang" title="English / Español"></button>
  <button id="btnTheme" data-t-title="theme">☾</button>
</header>

<div class="wrap">
  <section class="card">
    <h2 data-t="scale"></h2>
    <div class="display">
      <div id="weight">0.000</div>
      <div id="phase"></div>
    </div>
    <div class="row">
      <button id="btnConnect" class="primary"></button>
      <button id="btnSimulate" class="soft" data-t="simulate"></button>
      <button id="btnCapture" data-t="captureNow" disabled></button>
    </div>
    <div class="row" id="simControls" hidden>
      <span class="sub" data-t="simulator"></span>
      <input id="simWeight" type="number" step="0.001" min="0" value="1.250" style="width:110px">
      <button id="btnPlace" data-t="place"></button>
      <button id="btnRemove" data-t="remove"></button>
      <button id="btnDrop" data-t="drop"></button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="swLog"> <span data-t="rawFrames"></span></label>
    </div>
    <div id="notice" role="status"></div>
    <div id="log" hidden></div>
  </section>

  <section class="card">
    <h2 data-t="batch"></h2>
    <div class="row">
      <label>PLU <input id="plu" type="number" min="1" max="99999" value="90050" style="width:100px"></label>
      <label><span data-t="name"></span> <input id="name" style="width:180px"></label>
    </div>
    <table><thead><tr><th>#</th><th data-t="weightCol"></th><th data-t="source"></th><th></th></tr></thead><tbody id="batch"></tbody></table>
    <div class="row">
      <span id="summary" class="sub"></span>
      <button id="btnPrint" class="primary" data-t="print"></button>
      <button id="btnClear" data-t="clear"></button>
    </div>
    <p class="sub" data-t-html="footnote"></p>
  </section>
</div>

<div id="printArea"></div>

<script>
(function () {
  var N = window.Nitori;
  var TEXTS = {
    en: {
      kicker: 'scale demo over Web Serial', theme: 'Switch theme', scale: 'Scale', simulate: 'Use simulated scale', captureNow: 'Capture now',
      connect: 'Connect scale', disconnect: 'Disconnect', simulator: 'Simulator:', place: 'Place', remove: 'Remove', drop: 'Pull the cable',
      rawFrames: 'Show raw frames', batch: 'Batch', name: 'Name', defaultName: 'Test product', weightCol: 'Weight', source: 'Source',
      print: 'Print labels', clear: 'Clear', removeRow: 'remove', empty: 'No weighings.', weighing: 'weighing', weighings: 'weighings',
      fromScale: 'scale', fromManual: 'manual', fromManualUnstable: 'manual (unstable)',
      noSerial: 'Web Serial only exists in desktop Chrome or Edge. Try the simulated scale.', zero: 'The weight is zero.', nothing: 'There are no weighings.',
      phases: { empty: 'Place a package', weighing: 'Weighing… ', settling: 'Settling…', stable: 'Added: ', removed: 'Place a package' },
      states: { disconnected: 'disconnected', connecting: 'connecting', connected: 'connected', reconnecting: 'reconnecting' },
      footnote: 'The demo makes an identity code <code>08 + PLU + sequence</code> with a local counter, just to see it printed. In a real app your database reserves the sequence (see <a href="https://github.com/Chidaruma696/Chimata">Chimata</a>).',
      messages: {}
    },
    es: {
      kicker: 'demo de báscula por Web Serial', theme: 'Cambiar tema', scale: 'Báscula', simulate: 'Usar báscula simulada', captureNow: 'Capturar ahora',
      connect: 'Conectar báscula', disconnect: 'Desconectar', simulator: 'Simulador:', place: 'Colocar', remove: 'Retirar', drop: 'Simular desconexión',
      rawFrames: 'Mostrar tramas crudas', batch: 'Tanda', name: 'Nombre', defaultName: 'Producto de prueba', weightCol: 'Peso', source: 'Origen',
      print: 'Imprimir etiquetas', clear: 'Limpiar', removeRow: 'quitar', empty: 'Sin pesadas.', weighing: 'pesada', weighings: 'pesadas',
      fromScale: 'báscula', fromManual: 'manual', fromManualUnstable: 'manual (inestable)',
      noSerial: 'Web Serial solo existe en Chrome o Edge de escritorio. Prueba la báscula simulada.', zero: 'El peso está en cero.', nothing: 'No hay pesadas.',
      phases: { empty: 'Coloca paquete', weighing: 'Pesando… ', settling: 'Estabilizando…', stable: 'Agregado: ', removed: 'Coloca paquete' },
      states: { disconnected: 'desconectada', connecting: 'conectando', connected: 'conectada', reconnecting: 'reconectando' },
      footnote: 'La demo genera un código de identidad <code>08 + PLU + secuencia</code> con un contador local, solo para verlo impreso. En una app real la secuencia la reserva tu base de datos (ver <a href="https://github.com/Chidaruma696/Chimata">Chimata</a>).',
      messages: {
        ready: 'Coloca paquete', reconnectedAlone: 'Báscula lista (reconectada sola)', reconnected: 'Báscula reconectada',
        reconnecting: 'Se perdió la conexión. Reintentando…', lost: 'No se pudo recuperar. Conéctala de nuevo.', disconnected: 'Sin conexión',
        unplugged: 'Báscula desconectada (USB)', connectFailed: 'No se pudo conectar', silent: 'La báscula no responde; se reabre el puerto.',
        stuck: 'El puerto no acepta datos; se reabre.', unit: 'La báscula está en {unit}; los pesos se convierten a kg.'
      }
    }
  };

  function pickLang() {
    try { var saved = localStorage.getItem('nitori:lang'); if (TEXTS[saved]) return saved; } catch (e) {}
    return /^es\b/i.test(navigator.language || '') ? 'es' : 'en';
  }
  var lang = pickLang(), T = TEXTS[lang];

  var elWeight = document.getElementById('weight'), elPhase = document.getElementById('phase'), elChip = document.getElementById('chip');
  var elLog = document.getElementById('log'), swLog = document.getElementById('swLog'), elNotice = document.getElementById('notice');
  var scale = null, batch = [], sequence = 0;
  try { sequence = parseInt(localStorage.getItem('nitori:demo:seq') || '0', 10); } catch (e) {}

  function notice(text) { elNotice.textContent = text || ''; }

  function paintTexts() {
    T = TEXTS[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = T[el.dataset.t]; });
    document.querySelectorAll('[data-t-html]').forEach(function (el) { el.innerHTML = T[el.dataset.tHtml]; });
    document.querySelectorAll('[data-t-title]').forEach(function (el) { el.title = T[el.dataset.tTitle]; });
    document.getElementById('btnLang').textContent = lang === 'es' ? 'EN' : 'ES';
    var name = document.getElementById('name');
    if (!name.value || name.value === TEXTS.en.defaultName || name.value === TEXTS.es.defaultName) name.value = T.defaultName;
    if (scale) scale.messages = Object.assign({}, N.MESSAGES, T.messages);
    paintState({ state: scale ? scale.state : 'disconnected', message: scale ? '' : T.messages.disconnected || N.MESSAGES.disconnected });
    paintBatch();
  }

  function log(t) { if (!swLog.checked) return; elLog.textContent += t; elLog.scrollTop = elLog.scrollHeight; }
  swLog.addEventListener('change', function () { elLog.hidden = !swLog.checked; });

  function paintState(s) {
    elChip.textContent = T.states[s.state];
    elChip.className = 'chip ' + (s.state === 'connected' ? 'on' : s.state === 'reconnecting' ? 're' : 'off');
    if (s.message) elPhase.textContent = s.message;
    document.getElementById('btnCapture').disabled = s.state !== 'connected';
    document.getElementById('btnConnect').textContent = s.state === 'connected' ? T.disconnect : T.connect;
  }

  function hook(s) {
    s.on('state', paintState);
    s.on('frame', function (f) { log(f.text); });
    s.on('weight', function (w) { elWeight.textContent = w.kg.toFixed(3); elWeight.style.color = w.kg > 0 ? 'var(--mauve)' : 'var(--overlay)'; });
    s.on('phase', function (p) {
      var label = T.phases[p.phase];
      if (p.phase === 'weighing') label += p.kg.toFixed(3) + ' kg';
      if (p.phase === 'stable') label += p.kg.toFixed(3) + ' kg';
      if (label) elPhase.textContent = label;
    });
    s.on('stable', function (w) { elWeight.style.color = 'var(--green)'; add(w.kg, 'fromScale'); });
    s.on('warning', function (w) { notice(w.message); });
    s.on('error', function (e) { console.warn(e.error); });
  }

  function create(simulated) {
    if (scale) scale.disconnect();
    var opts = { messages: T.messages };
    scale = simulated ? N.simulatedScale(Object.assign({ interval: 250 }, opts)) : new N.Scale(opts);
    hook(scale);
    document.getElementById('simControls').hidden = !simulated;
    return scale;
  }

  document.getElementById('btnConnect').addEventListener('click', async function () {
    notice('');
    if (scale && scale.connected) { await scale.disconnect(); return; }
    if (!N.Scale.supported) { notice(T.noSerial); return; }
    await create(false).connect();
  });
  document.getElementById('btnSimulate').addEventListener('click', async function () { notice(''); await create(true).connect(); });
  document.getElementById('btnCapture').addEventListener('click', function () {
    var kg = scale && scale.capture();
    if (kg == null) { notice(T.zero); return; }
    add(kg, scale.stable ? 'fromManual' : 'fromManualUnstable');
  });
  document.getElementById('btnPlace').addEventListener('click', function () { scale.simulator.place(parseFloat(document.getElementById('simWeight').value) || 0); });
  document.getElementById('btnRemove').addEventListener('click', function () { scale.simulator.remove(); });
  document.getElementById('btnDrop').addEventListener('click', function () { scale.simulator.drop(); });

  // ---- batch and printing (demo only) ----
  function ean13(base12) {
    var s = 0; for (var i = 0; i < 12; i++) s += parseInt(base12[i], 10) * (i % 2 === 0 ? 1 : 3);
    return base12 + String((10 - (s % 10)) % 10);
  }
  function identityCode(plu) {
    sequence = (sequence + 1) % 100000;
    try { localStorage.setItem('nitori:demo:seq', String(sequence)); } catch (e) {}
    return ean13('08' + String(plu).padStart(5, '0').slice(-5) + String(sequence).padStart(5, '0'));
  }
  function add(kg, source) { batch.push({ kg: Math.round(kg * 1000) / 1000, source: source }); paintBatch(); }
  function paintBatch() {
    var tb = document.getElementById('batch');
    tb.innerHTML = batch.length ? batch.map(function (p, i) {
      return '<tr><td>' + (i + 1) + '</td><td class="num">' + p.kg.toFixed(3) + ' kg</td><td class="sub">' + T[p.source] + '</td><td><button data-q="' + i + '">' + T.removeRow + '</button></td></tr>';
    }).join('') : '<tr><td colspan="4" class="sub">' + T.empty + '</td></tr>';
    tb.querySelectorAll('button[data-q]').forEach(function (b) { b.addEventListener('click', function () { batch.splice(+b.dataset.q, 1); paintBatch(); }); });
    var total = batch.reduce(function (s, p) { return s + p.kg; }, 0);
    document.getElementById('summary').textContent = batch.length ? batch.length + ' ' + (batch.length === 1 ? T.weighing : T.weighings) + ' · ' + total.toFixed(3) + ' kg' : '';
  }
  document.getElementById('btnClear').addEventListener('click', function () { batch = []; paintBatch(); });
  document.getElementById('btnPrint').addEventListener('click', function () {
    if (!batch.length) { notice(T.nothing); return; }
    var plu = parseInt(document.getElementById('plu').value, 10) || 0, name = document.getElementById('name').value || T.defaultName;
    var area = document.getElementById('printArea');
    var items = batch.map(function (p) { return { kg: p.kg, code: identityCode(plu) }; });
    area.innerHTML = items.map(function (it, i) {
      return '<div class="label"><div class="n"></div><svg id="bc' + i + '"></svg><div class="p">' + it.kg.toFixed(3) + ' kg</div></div>';
    }).join('');
    area.querySelectorAll('.n').forEach(function (el) { el.textContent = name; });
    items.forEach(function (it, i) { try { JsBarcode('#bc' + i, it.code, { format: 'EAN13', width: 1.6, height: 38, fontSize: 11, margin: 2 }); } catch (e) { console.warn(e); } });
    setTimeout(function () { window.print(); }, 250);
  });

  // Language: follows the browser; the button switches and remembers it.
  document.getElementById('btnLang').addEventListener('click', function () {
    lang = lang === 'es' ? 'en' : 'es';
    try { localStorage.setItem('nitori:lang', lang); } catch (e) {}
    paintTexts();
  });

  // Theme: follows the system; the button forces latte/mocha and remembers it.
  var btnTheme = document.getElementById('btnTheme');
  function currentTheme() { var f = document.documentElement.dataset.theme; if (f) return f; return matchMedia('(prefers-color-scheme: dark)').matches ? 'mocha' : 'latte'; }
  function paintTheme() { btnTheme.textContent = currentTheme() === 'mocha' ? '☀' : '☾'; }
  btnTheme.addEventListener('click', function () {
    var next = currentTheme() === 'mocha' ? 'latte' : 'mocha';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('nitori:theme', next); } catch (e) {}
    paintTheme();
  });
  paintTheme();

  paintTexts();
  if (N.Scale.supported) { create(false).reconnect(); }
})();
</script>
</body>
</html>
